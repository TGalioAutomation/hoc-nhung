services:
  hoc-nhung:
    build:
      context: .
      dockerfile: Dockerfile.vps
    image: hoc-nhung-community:v1.2.0
    container_name: hoc-nhung-velxio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/velxio.db
      - DATA_DIR=/app/data
      - IDF_PATH=/opt/esp-idf
      - IDF_TOOLS_PATH=/root/.espressif
      - ARDUINO_ESP32_PATH=/opt/arduino-esp32
      - IDF_CCACHE_ENABLE=1
      - CCACHE_DIR=/var/cache/ccache
      - VELXIO_PERSISTENT_BUILD_DIR=1
      - VELXIO_LIGHT_BUILD_SLOTS=4
      - VELXIO_HEAVY_BUILD_SLOTS=2
      - VELXIO_BUILD_VARIANT_REPLICAS=1
      - VELXIO_NINJA_JOBS=2
      - VELXIO_ARTIFACT_CACHE_MAX_ENTRIES=1000
      - VELXIO_MAX_QEMU_SESSIONS=15
      - VELXIO_QEMU_IDLE_TIMEOUT_S=600
    volumes:
      - ./data:/app/data
      - hoc-nhung-arduino-libs:/root/.arduino15
      - hoc-nhung-ccache:/var/cache/ccache
      - hoc-nhung-build:/var/lib/velxio-build
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hoc-nhung-arduino-libs:
  hoc-nhung-ccache:
  hoc-nhung-build:
